<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>RenitaOS — Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/styles.css">
<!-- Standardization Pass 3, item 7 — the shared nav-rail stylesheet, same
     one index.html links, so Capture's reduced footer nav can't drift from
     Inbox/Today's own rail. -->
<link rel="stylesheet" href="./css/nav-rail.css">
</head>
<body>
<div class="capture-screen">
  <div class="capture-scroll">
    <header class="capture-header">
      <button id="closeBtn" class="icon-circle" aria-label="Clear">✕</button>
      <div class="header-label">Capture</div>
      <div class="header-actions">
        <button id="composeBtn" class="capture-compose-link hidden" type="button" title="Continue this note in Compose">Compose ↗</button>
      </div>
    </header>

    <div class="pill-row">
      <span id="taskPill" class="task-pill">Note</span>
      <!-- Nov 2026 refresh — the shorthand hints are tappable keys: each
           inserts its symbol at the caret (saves a trip to the phone's
           symbol keyboard). Labels show on wider screens only. -->
      <div class="sym-keys" role="group" aria-label="Insert shorthand">
        <button type="button" class="sym-key" data-sym="#" title="Tag">#<span>tag</span></button>
        <button type="button" class="sym-key" data-sym="@" title="Person">@<span>person</span></button>
        <button type="button" class="sym-key" data-sym="!" title="Project">!<span>project</span></button>
        <button type="button" class="sym-key" data-sym="%" title="Domain">%<span>domain</span></button>
        <button type="button" class="sym-key" data-sym="/" title="Type">/<span>type</span></button>
        <button type="button" class="sym-key" data-sym="+" title="Make it a task">+<span>task</span></button>
      </div>
    </div>

    <div class="composer">
      <input id="titleInput" class="capture-title-input" type="text" placeholder="Title (optional)" maxlength="200">
      <textarea id="captureText" class="capture-textarea" placeholder="What's on your mind?"></textarea>
    </div>

    <div id="voicePanel" class="mode-panel hidden">
      <div class="mode-panel-icon">●</div>
      <div class="mode-panel-copy">
        <div class="mode-panel-title">Listening…</div>
        <div class="mode-panel-sub">Voice capture isn't wired up yet</div>
      </div>
      <button class="manual-task-toggle">Mark as Task</button>
    </div>

    <div id="photoPanel" class="mode-panel hidden">
      <div class="mode-panel-icon mode-panel-icon--photo"></div>
      <div class="mode-panel-copy">
        <div class="mode-panel-title">Photo attached</div>
        <div class="mode-panel-sub">Photo capture isn't wired up yet</div>
      </div>
      <button class="manual-task-toggle">Mark as Task</button>
    </div>

    <section id="recognizedSection" class="hidden">
      <div class="recognized-label">Recognized</div>
      <div id="thoughtsList"></div>
    </section>

    <section id="recentSection" class="hidden">
      <div class="recent-label">Just captured</div>
      <div id="recentList"></div>
    </section>
  </div>

  <div class="capture-footer">
    <!-- Nov 2026 refresh — Voice/Photo mode switch removed until either is
         actually wired (both panels only said "isn't wired up yet"); the
         panels and state.mode stay in place for when they are.
         Autocomplete moved here from under the caret: a chip strip just
         above Save, so suggestions never cover the line being typed. -->
    <div id="autocomplete" class="ac-strip hidden" aria-label="Suggestions"></div>

    <div class="save-row">
      <button id="saveBtn" class="save-btn">Save to Inbox</button>
    </div>

    <!-- Standardization Pass 3, item 7 — same shared rail component
         Today/Inbox/every profile render (js/navRail.js), fed Capture's
         own reduced item set and styled with the .dmn-rail--bar variant
         (css/nav-rail.css) so it keeps sitting inline in this footer
         instead of becoming a left column or a fixed overlay. Populated
         below, right after js/navRail.js loads. -->
    <div id="captureNavRail" class="dmn-rail dmn-rail--bar"></div>

    <div id="toast" class="toast hidden"></div>
  </div>

</div>

<!-- Standardization Pass 3, item 7 — the shared rail's markup, same plain
     classic script index.html loads (window.RenitaNavRail); mounts before
     js/app.js's module script below. -->
<script src="./js/navRail.js"></script>
<script>
  document.getElementById('captureNavRail').innerHTML =
    RenitaNavRail.renderNavRailHTML(RenitaNavRail.CAPTURE_NAV_ITEMS, { activeRoute: 'capture' });
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
